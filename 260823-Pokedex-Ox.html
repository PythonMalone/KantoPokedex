<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kanto Pokédex · Gen 1 · #001–050</title>
<style>
:root{
  --bg:#0e1120;--panel:#171b2e;--panel2:#1e2340;--line:#2a3050;
  --ink:#eef1ff;--mut:#98a1c6;--acc:#ffcb05;--acc2:#3b5ba9;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1100px 600px at 85% -10%,#20264a,var(--bg)) fixed;
}
body.squad{background:radial-gradient(1200px 700px at 50% -10%,#123a63,#081a30) fixed}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:22px clamp(16px,4vw,44px) 4px}
h1{margin:0;font-size:clamp(1.35rem,3.2vw,2rem);letter-spacing:.4px;display:flex;align-items:center;gap:.55em}
h1 .pokeball{width:1em;height:1em;flex:none;border-radius:50%;background:
  linear-gradient(#e3350d 0 46%,#22252e 46% 56%,#f0f2f7 56% 100%);position:relative;box-shadow:inset 0 0 0 .09em #22252e}
h1 .pokeball::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 .07em #22252e}
h1 small{display:block;width:100%;font-size:.48em;font-weight:600;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:.93rem;outline:none;font-family:inherit}
input[type=search]{min-width:min(250px,58vw)}
input:focus-visible,select:focus-visible,.chip:focus-visible{border-color:var(--acc);outline:none}
.typebar{display:flex;flex-wrap:wrap;gap:6px;padding:12px clamp(16px,4vw,44px) 14px}
.chip{cursor:pointer;background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-family:inherit;transition:.15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--tc,var(--acc));border-color:transparent;color:#10121d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px;padding:2px clamp(16px,4vw,44px) 40px}
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 12px;text-align:center;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.card::before{content:"";position:absolute;top:-34px;right:-34px;width:86px;height:86px;border-radius:50%;background:var(--tint,transparent);opacity:.28;filter:blur(2px)}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#4a5588;box-shadow:0 12px 26px rgba(0,0,0,.45)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{position:absolute;top:9px;left:11px;font-size:.72rem;font-weight:800;color:var(--mut);letter-spacing:.06em}
.card img{width:96px;height:96px;object-fit:contain;image-rendering:auto;margin:6px auto 4px;display:block}
.card h2{margin:2px 0 8px;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.badge{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#10121d;background:var(--tc,#888)}
.bst{margin-top:8px;font-size:.68rem;color:var(--mut);font-weight:600;letter-spacing:.05em}
body.squad .card[data-water="1"]{border-color:#3b82c4}
body.squad .leader{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,203,5,.45),0 14px 30px rgba(0,0,0,.5)}
body.squad .leader::after{content:"🕶️";position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:44px;pointer-events:none}
.empty{padding:60px 20px;text-align:center;color:var(--mut);font-weight:600}
footer{padding:8px clamp(16px,4vw,44px) 30px;color:#5a6288;font-size:.75rem}
/* ---------- modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(6,8,16,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#overlay.open{display:flex}
.modal{position:relative;width:min(480px,100%);max-height:min(92vh,720px);overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #39406b;border-radius:22px;padding:22px 22px 18px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mclose{position:absolute;top:10px;right:12px;background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer}
.mclose:hover{color:var(--ink);border-color:#4a5588}
.mnum{font-size:.78rem;font-weight:800;color:var(--mut);letter-spacing:.08em}
.mname{margin:2px 0 4px;font-size:1.55rem;font-weight:800}
.msprite{display:block;width:min(200px,52vw);height:min(200px,52vw);object-fit:contain;margin:4px auto 2px;cursor:pointer;user-select:none;-webkit-user-drag:none}
.mdesc{text-align:center;color:#c6cdf0;font-size:.88rem;margin:6px auto 12px;max-width:36ch}
.mrow{display:flex;justify-content:center;gap:18px;color:var(--mut);font-size:.82rem;font-weight:600;margin-bottom:12px}
.mrow b{color:var(--ink)}
.stats{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.stat{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:10px;font-size:.76rem;font-weight:700;color:var(--mut)}
.bar{height:8px;border-radius:999px;background:#242a48;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s ease}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.nav button:disabled{opacity:.35;cursor:default}
/* ---------- fx / toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);background:#0d2c4e;border:1px solid #3b82c4;color:#dff1ff;font-weight:800;font-size:.9rem;padding:12px 22px;border-radius:999px;z-index:60;transition:transform .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center;max-width:92vw}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30;display:none}
body.squad #fx{display:block}
.drop{position:absolute;top:-6vh;font-size:26px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(116vh) rotate(340deg)}}
@media (prefers-reduced-motion:reduce){.drop{display:none}.modal{animation:none}}
</style>
</head>
<body>

<header>
  <h1><span class="pokeball" aria-hidden="true"></span>Kanto Pokédex
    <small>Generation I · Entries #001 – #050</small>
  </h1>
  <div class="controls">
    <input id="q" type="search" placeholder="Search name or number…" aria-label="Search Pokémon by name or number" autocomplete="off">
    <select id="sort" aria-label="Sort order">
      <option value="dex">Sort: Dex № ↑</option>
      <option value="dex-desc">Sort: Dex № ↓</option>
      <option value="name">Sort: A → Z</option>
      <option value="bst">Sort: Base stat total ↓</option>
    </select>
  </div>
</header>

<nav class="typebar" id="typebar" aria-label="Filter by type"></nav>
<main class="grid" id="grid" role="list"></main>
<div class="empty" id="empty" hidden>No Pokémon match your search. Try clearing filters.</div>
<footer>Data: canonical Kanto order (Gen I) · Sprites via PokeAPI sprite CDN · No sounds, just vibes.</footer>

<!-- detail modal -->
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="mName">
  <section class="modal">
    <button class="mclose" id="mClose" aria-label="Close details">✕</button>
    <div class="mnum" id="mNum"></div>
    <h2 class="mname" id="mName"></h2>
    <img class="msprite" id="mImg" alt="" draggable="false">
    <p class="mdesc" id="mDesc"></p>
    <div class="badges" id="mTypes" style="justify-content:center;margin-bottom:10px"></div>
    <div class="mrow"><span>Height <b id="mHt"></b></span><span>Weight <b id="mWt"></b></span><span>BST <b id="mBst"></b></span></div>
    <div class="stats" id="mStats"></div>
    <div class="nav">
      <button id="mPrev">← Prev</button>
      <button id="mNext">Next →</button>
    </div>
  </section>
</div>

<div id="toast" role="status"></div>
<div id="fx" aria-hidden="true"></div>

<script>
"use strict";
/* ============ DATA — Gen 1, entries 1–50 ============
   [id, name, [types], height_m, weight_kg, baseStatTotal,
    hp, atk, def, spe, flavor]                                   */
const DEX=[
/* [id, name, [types], height_m, weight_kg,
    hp, atk, def, spA, spD, spe, flavor]  — BST computed at runtime */
[1,"Bulbasaur",["grass","poison"],0.7,6.9,45,49,49,65,65,45,"A strange seed was planted on its back at birth."],
[2,"Ivysaur",["grass","poison"],1.0,13.0,60,62,63,80,80,80,"The bulb on its back grows as it soaks up sunlight."],
[3,"Venusaur",["grass","poison"],2.0,100.0,80,82,83,100,100,80,"Its flower releases a soothing scent after rain."],
[4,"Charmander",["fire"],0.6,8.5,39,52,43,60,50,65,"The flame on its tail shows its life force."],
[5,"Charmeleon",["fire"],1.1,19.0,58,64,58,80,65,80,"Hot-tempered; its tail flame flares when it gets angry."],
[6,"Charizard",["fire","flying"],1.7,90.5,78,84,78,109,85,100,"Breathes fire hot enough to melt boulders."],
[7,"Squirtle",["water"],0.5,9.0,44,48,65,50,64,43,"Shell up, shades on — leader of the Squad."],
[8,"Wartortle",["water"],1.0,22.5,59,63,80,65,80,58,"Its long furry tail is a symbol of longevity."],
[9,"Blastoise",["water"],1.6,85.5,79,83,100,85,105,78,"Hydro cannons on its shell blast with brutal force."],
[10,"Caterpie",["bug"],0.3,2.9,45,30,35,20,20,45,"Its antennae release a foul stench to repel foes."],
[11,"Metapod",["bug"],0.7,9.9,50,20,55,25,25,30,"It hardens its shell while awaiting evolution."],
[12,"Butterfree",["bug","flying"],1.1,32.0,60,45,50,90,80,70,"It flaps its wings to scatter a toxic dust."],
[13,"Weedle",["bug","poison"],0.3,3.2,40,35,30,20,20,50,"A tiny venomous stinger hides atop its head."],
[14,"Kakuna",["bug","poison"],0.6,10.0,45,25,50,25,25,35,"Nearly motionless, it hardens as danger nears."],
[15,"Beedrill",["bug","poison"],1.0,29.5,65,90,40,45,80,75,"Twin stingers jab in lightning-fast drills."],
[16,"Pidgey",["normal","flying"],0.3,1.8,40,45,40,35,35,56,"A docile bird that prefers to flee, not fight."],
[17,"Pidgeotto",["normal","flying"],1.1,30.0,63,60,55,50,50,71,"Claims a vast territory and patrols it fiercely."],
[18,"Pidgeot",["normal","flying"],1.5,39.5,83,80,75,70,70,101,"Flies at Mach 2 in search of prey."],
[19,"Rattata",["normal"],0.3,3.5,30,56,35,25,35,72,"Bites anything with its ever-growing fangs."],
[20,"Raticate",["normal"],0.7,18.5,55,81,60,50,70,97,"Whiskers help it keep balance while running."],
[21,"Spearow",["normal","flying"],0.3,2.0,40,60,30,31,31,70,"Far noisier and more aggressive than Pidgey."],
[22,"Fearow",["normal","flying"],1.2,38.0,65,90,65,61,61,100,"Soars for days on huge wings without rest."],
[23,"Ekans",["poison"],2.0,6.9,35,60,44,40,54,55,"It coils up silently before striking."],
[24,"Arbok",["poison"],3.5,65.0,60,95,69,65,79,80,"Its hood pattern paralyzes prey with fear."],
[25,"Pikachu",["electric"],0.4,6.0,35,55,40,50,50,90,"Stores electricity in the pouches of its cheeks."],
[26,"Raichu",["electric"],0.8,30.0,60,90,55,90,80,110,"Discharges 100,000-volt bolts when battle-ready."],
[27,"Sandshrew",["ground"],0.6,12.0,50,75,85,20,30,40,"Curls into a spiky ball to defend itself."],
[28,"Sandslash",["ground"],1.0,29.5,75,100,110,45,55,65,"Its claws shed and regrow, sharp as swords."],
[29,"Nidoran\u2640",["poison"],0.4,7.0,55,47,52,40,40,41,"Tiny barbs on its back secrete a potent venom."],
[30,"Nidorina",["poison"],0.8,20.0,70,62,67,55,55,56,"A gentle mother that rarely bares its barbs."],
[31,"Nidoqueen",["poison","ground"],1.3,60.0,90,92,87,75,85,76,"Armor-like scales shield its powerful charge."],
[32,"Nidoran\u2642",["poison"],0.5,9.0,46,57,40,40,40,50,"Its ears swivel in every direction for danger."],
[33,"Nidorino",["poison"],0.9,19.5,61,72,57,55,55,65,"A horn harder than diamond — temper shorter too."],
[34,"Nidoking",["poison","ground"],1.4,62.0,81,102,77,85,75,85,"One swing of its tail can bend steel poles."],
[35,"Clefairy",["fairy"],0.6,7.5,70,45,48,60,65,35,"Drawn by moonlight, it dances on quiet mountains."],
[36,"Clefable",["fairy"],1.3,40.0,95,70,73,95,90,60,"It steps so lightly it seems to skip on air."],
[37,"Vulpix",["fire"],0.6,9.9,38,41,40,50,65,65,"Its six tails grow warmer as it matures."],
[38,"Ninetales",["fire"],1.1,19.9,73,76,75,81,100,100,"Nine tails hold mystical, long-lived power."],
[39,"Jigglypuff",["normal","fairy"],0.5,5.5,115,45,20,45,25,20,"Its lullaby puts anyone who hears it to sleep."],
[40,"Wigglytuff",["normal","fairy"],1.0,12.0,140,70,45,85,50,45,"Its fine fur feels as smooth as velvet."],
[41,"Zubat",["poison","flying"],0.8,7.5,40,45,35,30,40,55,"Emits ultrasonic waves to fly in total darkness."],
[42,"Golbat",["poison","flying"],1.6,55.0,75,80,70,65,75,90,"Drinks over ten ounces of blood in one feed."],
[43,"Oddish",["grass","poison"],0.5,5.4,45,50,55,75,65,30,"It buries itself by day and walks by night."],
[44,"Gloom",["grass","poison"],0.8,8.6,60,65,70,85,75,40,"Drool from its mouth smells absolutely horrid."],
[45,"Vileplume",["grass","poison"],1.2,18.6,75,80,85,110,90,50,"The world's largest petals shed allergy-inducing pollen."],
[46,"Paras",["bug","grass"],0.3,5.4,35,70,55,45,55,25,"Mushrooms on its back drain its strength."],
[47,"Parasect",["bug","grass"],1.0,29.5,60,95,80,60,80,30,"The mushroom calls all the shots now."],
[48,"Venonat",["bug","poison"],1.0,30.0,60,55,50,40,55,45,"Big compound eyes work like radar."],
[49,"Venomoth",["bug","poison"],1.5,12.5,70,65,60,90,75,90,"Fine scales of dust flutter from its wings."],
[50,"Diglett",["ground"],0.2,0.8,10,55,30,35,45,95,"It tunnels so fast the ground trembles."]
];

const TYPE_COLOR={normal:"#A8A77A",fire:"#EE8130",water:"#6390F0",electric:"#F7D02C",
grass:"#7AC74C",ice:"#96D9D6",fighting:"#C22E28",poison:"#A33EA1",ground:"#E2BF65",
flying:"#A98FF3",psychic:"#F95587",bug:"#A6B91A",rock:"#B6A136",ghost:"#735797",
dragon:"#6F35FC",fairy:"#D685AD",steel:"#B7B7CE",dark:"#705746"};

const SPRITE=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const ARTWORK=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const FALLBACK="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="14" fill="#232946"/><circle cx="48" cy="48" r="26" fill="none" stroke="#4a5588" stroke-width="4"/><circle cx="48" cy="48" r="8" fill="#4a5588"/><text x="48" y="88" font-size="11" fill="#98a1c6" text-anchor="middle" font-family="sans-serif">sprite offline</text></svg>');

/* ============ state + elements ============ */
const S={q:"",types:new Set(),sort:"dex"};
const $=s=>document.querySelector(s);
const grid=$("#grid"),empty=$("#empty"),typebar=$("#typebar"),
      overlay=$("#overlay"),qEl=$("#q"),sortEl=$("#sort");
let currentId=null;

const pad=n=>String(n).padStart(3,"0");
const badge=t=>`<span class="badge" style="--tc:${TYPE_COLOR[t]}">${t}</span>`;
const byId=id=>DEX.find(p=>p[0]===id);

/* ============ type chips ============ */
(function buildChips(){
  const counts={};
  DEX.forEach(p=>p[2].forEach(t=>counts[t]=(counts[t]||0)+1));
  Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b)).forEach(t=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=`${t} ${counts[t]}`;
    b.style.setProperty("--tc",TYPE_COLOR[t]);
    b.setAttribute("aria-pressed","false");
    b.onclick=()=>{S.types.has(t)?S.types.delete(t):S.types.add(t);
      b.setAttribute("aria-pressed",String(S.types.has(t)));render();};
    typebar.appendChild(b);
  });
})();

/* ============ render pipeline: filter -> sort -> paint ============ */
function visible(){
  let list=DEX.filter(p=>{
    const id=p[0],name=p[1];
    const hitQ=!S.q||String(id)===S.q.replace(/^#?0*/,"")||
      name.toLowerCase().includes(S.q.toLowerCase())||
      pad(id).includes(S.q.replace("#",""));
    return hitQ&&(!S.types.size||p[2].some(t=>S.types.has(t)));
  });
  const cmp={dex:(a,b)=>a[0]-b[0],"dex-desc":(a,b)=>b[0]-a[0],
    name:(a,b)=>a[1].localeCompare(b[1]),bst:(a,b)=>BST(b)-BST(a)};
  return list.sort(cmp[S.sort]);
}

function render(){
  const list=visible();
  grid.innerHTML=list.map(p=>{
    const [id,name,types]=p;
    const bst=BST(p);
    return `<article class="card${document.body.classList.contains("squad")?"":" "}"
      data-id="${id}" data-water="${types.includes("water")?1:0}" role="listitem"
      tabindex="0" aria-label="#${pad(id)} ${name}, ${types.join(" and ")}, base stat total ${bst}"
      style="--tint:${TYPE_COLOR[types[0]]}">
      <span class="num">#${pad(id)}</span>
      <img src="${SPRITE(id)}" alt="" loading="lazy" width="96" height="96"
        onerror="this.onerror=null;this.src=FALLBACK">
      <h2>${name}</h2>
      <div class="badges">${types.map(badge).join("")}</div>
      <div class="bst">BST ${bst}</div>
    </article>`;}).join("");
  empty.hidden=list.length>0;
  if(document.body.classList.contains("squad")){
    grid.querySelectorAll('.card').forEach(c=>{
      if(c.dataset.id==="7")c.classList.add("leader");});
  }
}

/* ============ modal ============ */
const STAT_LABELS=["HP","Attack","Defense","Sp. Atk","Sp. Def","Speed"];
const BST=p=>p.slice(5,11).reduce((a,b)=>a+b,0);
function openModal(id){
  currentId=id;const p=byId(id);if(!p)return;
  const pid=p[0],name=p[1],types=p[2],ht=p[3],wt=p[4],flavor=p[11];
  const st=p.slice(5,11),bst=BST(p);
  $("#mNum").textContent=`POKÉDEX ENTRY #${pad(pid)}`;
  $("#mName").textContent=name;
  const img=$("#mImg");
  img.src=ARTWORK(pid);img.alt=`Official artwork of ${name}`;
  img.onerror=()=>{img.onerror=null;img.src=FALLBACK;};
  $("#mDesc").textContent=`“${flavor}”`;
  $("#mTypes").innerHTML=types.map(badge).join("");
  $("#mHt").textContent=ht.toFixed(1)+" m";
  $("#mWt").textContent=wt.toFixed(1)+" kg";
  $("#mBst").textContent=bst;
  $("#mStats").innerHTML=st.map((v,i)=>`<div class="stat"><span>${STAT_LABELS[i]}</span>
      <span class="bar"><i style="width:${Math.min(100,v/160*100)}%"></i></span>
      <span style="color:var(--ink)">${v}</span></div>`).join("");
  $("#mPrev").disabled=id<=1;
  $("#mNext").disabled=id>=50;
  overlay.classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){overlay.classList.remove("open");currentId=null;document.body.style.overflow="";}
$("#mClose").onclick=closeModal;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
$("#mPrev").onclick=()=>openModal(Math.max(1,currentId-1));
$("#mNext").onclick=()=>openModal(Math.min(50,currentId+1));
document.addEventListener("keydown",e=>{
  if(!overlay.classList.contains("open"))return;
  if(e.key==="Escape")closeModal();
  else if(e.key==="ArrowLeft")openModal(Math.max(1,currentId-1));
  else if(e.key==="ArrowRight")openModal(Math.min(50,currentId+1));
});

/* card interactions (event delegation) */
grid.addEventListener("click",e=>{
  const c=e.target.closest(".card");if(c)openModal(+c.dataset.id);
});
grid.addEventListener("keydown",e=>{
  const c=e.target.closest(".card");
  if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openModal(+c.dataset.id);}
});

/* ============ controls ============ */
qEl.addEventListener("input",()=>{S.q=qEl.value.trim();render();});
sortEl.addEventListener("change",()=>{S.sort=sortEl.value;render();});

/* ============ toast ============ */
let toastTimer=null;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),3800);
}

/* ============ 🕶️ EASTER EGG — The Squirtle Squad ============
   Open Squirtle (#007), then tap/click his artwork 3× fast.
   Third tap assembles the Squad. Tap 3× again to disband.     */
let taps=0,tapTimer=null;
$("#mImg").addEventListener("click",()=>{
  if(currentId!==7){ // wrong Pokémon: reset silently with a hint once per open
    taps=0;return;}
  taps++;clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{taps=0;},1400);
  if(taps>=3){
    taps=0;
    const on=document.body.classList.toggle("squad");
    if(on){
      const fx=$("#fx");fx.innerHTML="";
      const glyphs=["🕶️","💧","🐢"];
      for(let i=0;i<14;i++){
        const d=document.createElement("span");
        d.className="drop";d.textContent=glyphs[i%glyphs.length];
        d.style.left=(Math.random()*100)+"vw";
        d.style.animationDuration=(4.5+Math.random()*5)+"s";
        d.style.animationDelay=(-Math.random()*6)+"s";
        d.style.fontSize=(16+Math.random()*22)+"px";
        fx.appendChild(d);
      }
      toast("🕶️ Squirtle Squad assembled! Nobody messes with the Squad.");
    }else{
      $("#fx").innerHTML="";
      toast("Squad disbanded… for now.");
    }
    render(); // repaint leader highlight / water borders
  }
});

render();
</script>
</body>
</html>
